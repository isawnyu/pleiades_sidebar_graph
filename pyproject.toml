[project]
name = "pleiades-sidebar-graph"
version = "0.1.0"
description = "Pleiades and friends"
readme = "README.md"
authors = [
    { name = "Tom Elliott", email = "ipse@paregorios.org" }
]
requires-python = ">=3.14"
dependencies = [
    "airtight>=0.2.0",
    "language-tags>=1.3.1",
    "networkx>=3.7",
    "notebook>=7.6.3",
    "pygraphviz>=2.0.3",
    "rdflib>=7.6.0",
    "textnorm>=1.2",
    "validators>=0.35.0",
]

[project.scripts]


[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]

[pytest]
log_cli=true

